<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aset UHP</title>
<style>
:root{
  --nvy:#072B54;--nvy2:#0D5EB6;--org:#F97D05;--orgD:#A8500A;
  --bg:#F1F1F4;--surf:#FFFFFF;--surf2:#F7F7F9;--surf3:#EDEDF0;--sdbg:#EAEAEE;
  --lb1:#1D1D1F;--lb2:rgba(60,60,67,.75);--lb3:rgba(60,60,67,.5);--lb4:rgba(60,60,67,.28);
  --sep:rgba(0,0,0,.09);--sep2:rgba(0,0,0,.14);
  --gr:#1D8A4E;--grB:#E8F4EC;--rd:#C8372B;--rdB:#FBEDEB;--am:#B26A00;--amB:#FDF2E3;--bl:#1D6FC4;--blB:#EAF2FB;
  --sh1:0 0 0 .5px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.05);
  --sh2:0 0 0 .5px rgba(0,0,0,.06),0 8px 28px rgba(0,0,0,.14);
  --rC:11px;--rS:6px;
}
[data-theme="dark"]{
  --bg:#0E141B;--surf:#161E27;--surf2:#1B242F;--surf3:#212C38;--sdbg:#121A22;
  --lb1:#F2F4F7;--lb2:rgba(235,240,245,.72);--lb3:rgba(235,240,245,.46);--lb4:rgba(235,240,245,.24);
  --sep:rgba(255,255,255,.09);--sep2:rgba(255,255,255,.15);
  --org:#FF9038;--orgD:#FFB273;
  --gr:#4FBE83;--grB:#12291D;--rd:#E8776B;--rdB:#2B1815;--am:#DFA355;--amB:#2A2013;--bl:#6FAFEE;--blB:#132436;
  --sh1:0 0 0 .5px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.3);
  --sh2:0 0 0 .5px rgba(255,255,255,.06),0 10px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--lb1);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
.mn{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex-shrink:0}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:var(--lb4);border-radius:6px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:var(--lb3);background-clip:content-box}::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh}
/* ---- sidebar ---- */
.sd{width:218px;flex-shrink:0;background:var(--sdbg);border-right:.5px solid var(--sep);display:flex;flex-direction:column}
.sdh{padding:16px 14px 13px}
.lg{display:flex;align-items:center;gap:9px}
.lgm{width:30px;height:30px;border-radius:8px;background:var(--nvy);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lgt .a{font-size:11.5px;font-weight:700;letter-spacing:.03em;line-height:1.2}
.lgt .a .o{color:var(--org)}
.lgt .b{font-size:9.5px;font-weight:700;letter-spacing:.18em;color:var(--lb3);line-height:1.3;margin-top:1px}
.be{display:inline-block;width:.48em;height:.62em;vertical-align:-.005em;margin-left:.04em;background:linear-gradient(to bottom,currentColor 0 25%,transparent 25% 37.5%,currentColor 37.5% 62.5%,transparent 62.5% 75%,currentColor 75% 100%)}
.sdn{flex:1;overflow-y:auto;padding:2px 9px 10px}
.sdl{font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--lb3);padding:13px 8px 4px}
.ni{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--rS);color:var(--lb1);cursor:pointer;font-size:13px;user-select:none;margin-bottom:1px}
.ni:hover{background:rgba(120,120,128,.12)}
.ni.on{background:var(--org);color:#fff}
.ni.on:hover{background:var(--org)}
.ni svg{width:15px;height:15px;stroke:var(--lb2);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ni.on svg{stroke:#fff}
.nb{margin-left:auto;font-size:11px;color:var(--lb3);font-variant-numeric:tabular-nums}
.ni.on .nb{color:rgba(255,255,255,.8)}
.nb.al{background:var(--rd);color:#fff;padding:0 5px;border-radius:8px;font-size:10.5px;font-weight:600;min-width:16px;text-align:center}
.ni.on .nb.al{background:rgba(255,255,255,.28)}
.sdf{padding:9px 11px;border-top:.5px solid var(--sep);display:flex;align-items:center;gap:8px}
.avt{width:24px;height:24px;border-radius:50%;background:var(--nvy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600}
.ibt{background:none;border:none;color:var(--lb3);cursor:pointer;padding:4px;border-radius:5px;display:flex}
.ibt:hover{background:rgba(120,120,128,.14);color:var(--lb1)}
.lngt{display:flex;background:var(--surf3);border-radius:6px;padding:1.5px;gap:1px;margin-right:2px}
.lngt span{font-size:9.5px;font-weight:600;padding:2px 5px;border-radius:4px;cursor:pointer;color:var(--lb3);letter-spacing:.02em;user-select:none}
.lngt span.on{background:var(--surf);color:var(--lb1);box-shadow:0 1px 1px rgba(0,0,0,.08)}
.ibt svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---- main ---- */
.mn2{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.tb{height:50px;flex-shrink:0;border-bottom:.5px solid var(--sep);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 20px;background:var(--surf2)}
h1{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.tbs{font-size:11.5px;color:var(--lb3);margin-top:1px}
.tba{display:flex;gap:7px;align-items:center}
.scr{flex:1;overflow-y:auto}
.ct{padding:18px 20px 60px;max-width:1180px}
.fade{animation:f .18s ease}
@keyframes f{from{opacity:0}to{opacity:1}}

/* ---- controls ---- */
.b{padding:4px 11px;border:.5px solid var(--sep2);background:var(--surf);border-radius:var(--rS);cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;box-shadow:0 1px 1px rgba(0,0,0,.03);white-space:nowrap}
.b:hover{background:var(--surf3)}
.b:active{background:var(--surf3);transform:scale(.98)}
.b svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.b.p{background:var(--org);color:#fff;border-color:transparent}
.b.p:hover{filter:brightness(1.06)}
.b.n{background:var(--nvy);color:#fff;border-color:transparent}
.b.n:hover{filter:brightness(1.25)}
.b.d{color:var(--rd)}
.b.s{padding:2px 8px;font-size:11.5px}
.b:disabled{opacity:.4;cursor:default}
.srh{position:relative;display:flex;align-items:center}
.srh svg{position:absolute;left:7px;width:13px;height:13px;stroke:var(--lb3);stroke-width:1.8;fill:none;pointer-events:none}
.srh input{width:196px;padding:4px 40px 4px 25px;border:.5px solid var(--sep2);border-radius:var(--rS);background:var(--surf);font-size:12.5px}
.srh input:focus{outline:none;border-color:var(--org);box-shadow:0 0 0 3px rgba(249,125,5,.16);width:250px}
.srh kbd{position:absolute;right:6px;font-family:ui-monospace,monospace;font-size:10px;color:var(--lb4)}
.in,select{padding:4px 8px;border:.5px solid var(--sep2);border-radius:var(--rS);background:var(--surf);font-size:12.5px;width:100%}
select{cursor:pointer;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--lb3) 50%),linear-gradient(135deg,var(--lb3) 50%,transparent 50%);background-position:calc(100% - 12px) 51%,calc(100% - 8px) 51%;background-size:4px 4px;background-repeat:no-repeat;padding-right:24px}
.in:focus,select:focus{outline:none;border-color:var(--org);box-shadow:0 0 0 3px rgba(249,125,5,.16)}
textarea.in{min-height:54px;resize:vertical}
.seg{display:inline-flex;background:var(--surf3);border-radius:7px;padding:2px;gap:2px}
.seg div{padding:3px 10px;border-radius:5px;font-size:12px;cursor:pointer;user-select:none;color:var(--lb2)}
.seg div.on{background:var(--surf);color:var(--lb1);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.09)}

/* ---- surfaces ---- */
.cd{background:var(--surf);border-radius:var(--rC);box-shadow:var(--sh1);overflow:hidden;margin-bottom:16px}
.cdh{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:.5px solid var(--sep)}
.cdt{font-size:12.5px;font-weight:600;letter-spacing:-.005em}
.cdb{padding:14px}
.gh{font-size:11px;font-weight:600;color:var(--lb3);letter-spacing:.02em;text-transform:uppercase;margin:0 0 7px 3px}
.g2{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:start}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

/* ---- stats ---- */
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stc{background:var(--surf);border-radius:var(--rC);box-shadow:var(--sh1);padding:12px 14px}
.stl{font-size:11.5px;color:var(--lb3);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.stl svg{width:12px;height:12px;stroke:var(--lb3);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.stv{font-size:25px;font-weight:600;letter-spacing:-.035em;line-height:1.08}
.std{font-size:11px;color:var(--lb3);margin-top:4px}
.std.r{color:var(--rd)}
.stc.dr,.bar.dr,.lgn .dr{cursor:pointer;transition:.12s}
.stc.dr:hover{background:var(--surf2);box-shadow:var(--sh1),0 0 0 1px var(--org)}
.stc.dr:active{transform:scale(.99)}
.stc.dr:hover .stl svg:last-child{stroke:var(--org)}
.bar.dr:hover .bl{color:var(--org)}
.bar.dr:hover .bf{filter:brightness(1.15)}
.lgn .dr:hover{color:var(--org)}
.stl{align-items:center}
tbody tr.selrow{background:var(--orgL)}
tbody tr.selrow:hover{background:var(--orgL)}
input[type=checkbox]{accent-color:var(--org);width:13px;height:13px;margin:0}

/* ---- rows ---- */
.rw{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:.5px solid var(--sep)}
.rw:last-child{border-bottom:none}
.rw.ck{cursor:pointer}.rw.ck:hover{background:var(--surf2)}
.ric{width:26px;height:26px;border-radius:7px;background:var(--surf3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ric svg{width:14px;height:14px;stroke:var(--lb2);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rm{flex:1;min-width:0}
.rt{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:11px;color:var(--lb3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chv{stroke:var(--lb4);width:12px;height:12px;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---- table ---- */
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:6px 12px;font-size:11px;font-weight:500;color:var(--lb3);border-bottom:.5px solid var(--sep);background:var(--surf2);white-space:nowrap;user-select:none;position:sticky;top:0;z-index:1}
th.s{cursor:pointer}th.s:hover{color:var(--lb1)}
th i{font-style:normal;color:var(--org);font-size:8px;margin-left:2px}
td{padding:7px 12px;font-size:12.5px;border-bottom:.5px solid var(--sep);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.ck{cursor:pointer}tbody tr.ck:hover{background:var(--surf2)}
.c1{font-weight:500}
.c2{font-size:11px;color:var(--lb3);margin-top:1px}
.nu{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;text-align:right;white-space:nowrap}
.emp{padding:38px 20px;text-align:center}
.emp svg{width:22px;height:22px;stroke:var(--lb4);stroke-width:1.5;fill:none;margin:0 auto 9px;stroke-linecap:round;stroke-linejoin:round}
.emp b{display:block;font-size:12.5px;font-weight:500;margin-bottom:2px}
.emp span{font-size:11.5px;color:var(--lb3)}

/* ---- status ---- */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 7px 1px 5px;border-radius:20px;white-space:nowrap;font-weight:500}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.pill.g{color:var(--gr);background:var(--grB)}
.pill.a{color:var(--am);background:var(--amB)}
.pill.r{color:var(--rd);background:var(--rdB)}
.pill.b{color:var(--bl);background:var(--blB)}
.pill.m{color:var(--lb3);background:var(--surf3)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surf3);color:var(--lb2)}

/* ---- bars ---- */
.bar{display:grid;grid-template-columns:76px 1fr 30px;align-items:center;gap:9px;margin-bottom:9px}
.bar:last-child{margin-bottom:0}
.bl{font-size:12px;color:var(--lb2)}
.bt{height:5px;background:var(--surf3);border-radius:3px;overflow:hidden}
.bf{height:100%;background:var(--nvy2);border-radius:3px;transition:width .3s}
.bn{font-size:11px;color:var(--lb3);text-align:right;font-variant-numeric:tabular-nums}
.pg{height:6px;background:var(--surf3);border-radius:3px;overflow:hidden;display:flex}
.pg span{transition:width .3s}
.lgn{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px}
.lgn div{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--lb2)}
.lgn i{width:7px;height:7px;border-radius:2px;display:block}

/* ---- timeline ---- */
.tl{position:relative;padding-left:15px}
.tl::before{content:"";position:absolute;left:3px;top:5px;bottom:5px;width:1.5px;background:var(--sep2);border-radius:1px}
.ti{position:relative;padding-bottom:11px}.ti:last-child{padding-bottom:0}
.ti::before{content:"";position:absolute;left:-15px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--surf);box-shadow:0 0 0 1.5px var(--sep2)}
.ti.n::before{background:var(--org);box-shadow:0 0 0 1.5px var(--org)}
.tt{font-size:12px;font-weight:500}
.ts2{font-size:11px;color:var(--lb3);margin-top:1px}

/* ---- overlays ---- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.16s;z-index:40;backdrop-filter:blur(2px)}
.ov.on{opacity:1;pointer-events:auto}
.dw{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:94vw;background:var(--surf);box-shadow:-1px 0 0 var(--sep);transform:translateX(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);z-index:50;overflow-y:auto}
.dw.on{transform:none}
.dwh{padding:13px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--surf);z-index:2;border-bottom:.5px solid var(--sep)}
.dwb{padding:14px 16px 44px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0}
.kv>div{display:contents}
.kr{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:.5px solid var(--sep);font-size:12.5px}
.kr:last-child{border-bottom:none}
.kr dt{color:var(--lb3);white-space:nowrap}
.kr dd{text-align:right}
.sec{margin-top:18px}
.sct{font-size:11px;font-weight:600;color:var(--lb3);text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px;padding-left:2px}
.ins{background:var(--surf2);border-radius:9px;padding:2px 12px}

.md{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.99);width:470px;max-width:94vw;max-height:88vh;overflow-y:auto;background:var(--surf);border-radius:13px;z-index:60;opacity:0;pointer-events:none;transition:.17s;box-shadow:var(--sh2)}
.md.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.mdh{padding:13px 16px;border-bottom:.5px solid var(--sep);display:flex;justify-content:space-between;align-items:center}
.mdt{font-size:13.5px;font-weight:600}
.mdb{padding:16px}
.mdf{padding:11px 16px;border-top:.5px solid var(--sep);display:flex;justify-content:flex-end;gap:8px;background:var(--surf2)}
.fl{margin-bottom:11px}.fl:last-child{margin-bottom:0}
.fl label{display:block;font-size:11.5px;color:var(--lb2);margin-bottom:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.cm{position:fixed;top:13%;left:50%;transform:translateX(-50%) scale(.98);width:540px;max-width:94vw;background:var(--surf);border-radius:13px;z-index:70;opacity:0;pointer-events:none;transition:.14s;box-shadow:var(--sh2);overflow:hidden}
.cm.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.cm input{width:100%;padding:13px 16px;border:none;background:none;font-size:15px;border-bottom:.5px solid var(--sep)}
.cm input:focus{outline:none}
.cml{max-height:320px;overflow-y:auto;padding:6px}
.cr2{padding:7px 11px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:13px}
.cr2.on{background:var(--org);color:#fff}
.cr2.on span{color:rgba(255,255,255,.75)!important}

.tst{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:7px;align-items:center}
.ts3{background:rgba(28,28,32,.94);color:#fff;padding:8px 15px;border-radius:9px;font-size:12.5px;box-shadow:0 6px 26px rgba(0,0,0,.28);animation:tu .22s cubic-bezier(.3,1.3,.5,1);max-width:400px;backdrop-filter:blur(12px);display:flex;align-items:center;gap:8px}
.ts3 i{width:6px;height:6px;border-radius:50%;background:#8E8E93;flex-shrink:0}
.ts3.g i{background:#31C55F}.ts3.r i{background:#FF463A}
@keyframes tu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.ph{width:100%;aspect-ratio:4/3;border-radius:9px;background:var(--surf3);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:26px;height:26px;stroke:var(--lb4);stroke-width:1.4;fill:none}
.lbp{background:#fff;border:.5px solid #ccc;border-radius:3px;padding:7px 8px;display:flex;align-items:center;gap:7px}
.lbp .n1{font-size:5.5px;color:#F97D05;letter-spacing:.11em;font-weight:700;text-transform:uppercase}
.lbp .n2{font-size:8px;color:#111;font-family:ui-monospace,monospace;font-weight:600;margin-top:1px}
.lbp .n3{font-size:5px;color:#777;margin-top:1px}

/* ---- layar kecil ----
   Sidebar jadi laci geser, tabel jadi kartu. Tanpa ini seluruh tampilan
   dirender di kanvas selebar 980px dan isinya terdorong ke luar layar. */
.mnb{display:none}
.sdsc{display:none}
@media(max-width:900px){
 .g2,.g3{grid-template-columns:1fr}
 .app{height:100dvh}
 .sd{position:fixed;top:0;bottom:0;left:0;width:250px;z-index:70;
  transform:translateX(-101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  box-shadow:2px 0 20px rgba(0,0,0,.16)}
 .sd.on{transform:none}
 .sdsc{display:block;position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:65;
  opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px)}
 .sdsc.on{opacity:1;pointer-events:auto}
 .mnb{display:inline-flex;flex-shrink:0;margin-right:2px}
 .tb{height:auto;min-height:52px;padding:8px 12px;flex-wrap:wrap;row-gap:8px}
 .tba{width:100%;order:3}
 .srh{flex:1;min-width:0}
 .srh kbd{display:none}
 .ct{padding:14px 12px 90px}
 .dw{width:100%;max-width:100%}
 /* Dialog naik dari bawah — lebih mudah dijangkau ibu jari */
 .md{top:auto;bottom:0;left:0;width:100%;max-width:100%;max-height:92dvh;
  border-radius:14px 14px 0 0;transform:translate(0,14px) scale(1)}
 .md.on{transform:none}
 /* Sasaran sentuh diperbesar */
 .b{padding:7px 13px;font-size:13px}
 .b.s{padding:6px 11px;font-size:12.5px}
 .ibt{width:34px;height:34px}
 /* 16px mencegah iOS ikut memperbesar halaman saat kolom disentuh */
 .in,input,select,textarea{font-size:16px}
 .seg div{padding:5px 10px}
}
@media(max-width:700px){
 /* Tabel jadi kartu. Nama kolom ditempelkan ke tiap sel oleh labeliTabel(). */
 .cd table,.cd tbody{display:block}
 .cd thead{display:none}
 .cd tbody tr{display:block;padding:10px 13px;border-bottom:.5px solid var(--sep)}

/* Penyusutan garis lurus atas dasar (harga − residu). Nilai buku berhenti di residu. */
function hitung(x){
  const jln=Math.max(0,(TODAY.getFullYear()-x.tgl.getFullYear())*12+(TODAY.getMonth()-x.tgl.getMonth()));
  const dasar=Math.max(0,x.harga-(x.residu||0));
  x.perBln=x.umur?dasar/x.umur:0;
  x.akum=Math.round(dasar*Math.min(1,jln/x.umur)/1000)*1000;
  x.nb=x.harga-x.akum;
  if(x.nb<(x.residu||0))x.nb=x.residu||0;
  x.blnJalan=jln;
  return x;
}

function fotoDari(link){
 if(!link)return null;
 const s=String(link).trim();
 let m=s.match(/drive\.google\.com\/file\/d\/([-\w]{10,})/)||s.match(/[?&]id=([-\w]{10,})/)||s.match(/drive\.google\.com\/open\?id=([-\w]{10,})/);
 if(m)return{url:'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w800',jenis:'drive'};
 if(/^(https?:)?\/\//i.test(s)&&/\.(jpe?g|png|webp|gif|avif)(\?|$)/i.test(s))return{url:s,jenis:'gambar'};
 if(/^blob:/.test(s))return{url:s,jenis:'lokal'};
 return{url:null,jenis:'halaman'};
}

let F={q:'',dept:'',kat:'',stat:'',link:'',kond:'',cara:'',lok:'',tglA:'',tglB:'',cetak:'',sort:'kode',dir:1};
function vReg(){
 let r=DB.aset.filter(x=>{
  if(F.dept&&x.dept!==F.dept)return 0;
  if(F.kat&&x.kat!==F.kat)return 0;
  if(F.stat&&x.stat!==F.stat)return 0;
  if(F.stat!=='DILEPAS'&&x.stat==='DILEPAS')return 0;
  if(F.kond&&x.kond!==F.kond)return 0;
  if(F.cara&&(x.cara||'BELI')!==F.cara)return 0;
  if(F.lok&&x.lok!==F.lok)return 0;
  /* Bandingkan per hari, bukan per milidetik — jam pada data tidak boleh
     membuat aset di tanggal batas ikut tersaring keluar. */
  if(F.tglA||F.tglB){
   const t=x.tgl instanceof Date?x.tgl:pd(x.tgl);
   if(isNaN(t))return 0;
   const hari=new Date(t.getFullYear(),t.getMonth(),t.getDate());
   if(F.tglA){const a=pd(F.tglA);if(!isNaN(a)&&hari<a)return 0}
   if(F.tglB){const b=pd(F.tglB);if(!isNaN(b)&&hari>b)return 0}
  }
  if(F.link==='ada'&&!x.link)return 0;
  if(F.link==='no'&&x.link)return 0;
  if(F.cetak==='sudah'&&!x.dicetak)return 0;
  if(F.cetak==='belum'&&x.dicetak)return 0;
  if(F.q&&!(x.kode+x.nama+x.sn+ln(x.lok)+x.pic+dn(x.dept)+(x.catatan||'')).toLowerCase().includes(F.q.toLowerCase()))return 0;
  return 1});
 r.sort((p,q)=>{const a=p[F.sort],b=q[F.sort];return(typeof a==='string'?a.localeCompare(b):a-b)*F.dir});
 const th=(k,l,c='')=>`<th class="s ${c}" data-s="${k}">${l}${F.sort===k?`<i>${F.dir>0?'▲':'▼'}</i>`:''}</th>`;

  <select id="flk" style="width:auto"><option value="">Semua lokasi</option>${DB.lok.map(d=>`<option value="${d.k}" ${F.lok===d.k?'selected':''}>${es(d.n)}</option>`).join('')}</select>
  <select id="fl" style="width:auto"><option value="">QR: semua</option><option value="ada" ${F.link==='ada'?'selected':''}>Sudah ada QR</option><option value="no" ${F.link==='no'?'selected':''}>Belum ada QR</option></select>
  <select id="fpc" style="width:auto"><option value="">Cetak: semua</option><option value="sudah" ${F.cetak==='sudah'?'selected':''}>Sudah dicetak</option><option value="belum" ${F.cetak==='belum'?'selected':''}>Belum dicetak</option></select>
  <div style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--lb3)">
   <span>Perolehan</span>
   <input type="date" id="fta" value="${es(F.tglA)}" style="width:auto;padding:3px 6px" title="Perolehan dari tanggal">
   <span>—</span>
   <input type="date" id="ftb" value="${es(F.tglB)}" style="width:auto;padding:3px 6px" title="Perolehan sampai tanggal">
  </div>
  <div class="seg">${['','TERSEDIA','DIPINJAM','PERBAIKAN','HILANG','DILEPAS'].map(s=>`<div class="${F.stat===s?'on':''}" data-st="${s}">${s?ST[s][1]:'Semua'}</div>`).join('')}</div>
  ${(F.dept||F.kat||F.kond||F.cara||F.lok||F.link||F.cetak||F.stat||F.tglA||F.tglB||F.q)?`<button class="b s" id="fclr" title="Bersihkan semua filter">${ic('x')}Bersihkan filter</button>`:''}

  <button class="b s" id="mClr">Batal pilih</button>
 </div></div>`:''}
 <div class="cd" style="margin:0">

 <tbody>${r.length?r.map(x=>{const l=loanOf(x.kode),tl=l&&late(l)>0;
  return`<tr class="ck ${SEL.has(x.kode)?'selrow':''}" data-k="${x.kode}">

  <td><div class="c1">${es(x.nama)}</div><div class="c2">${es(kn(x.kat))}${x.sn!=='—'?' · SN '+es(x.sn):''}</div></td>
  <td><span class="tag">${es(dn(x.dept))}</span></td>
  <td style="white-space:nowrap">${dt(x.tgl)}</td>
  <td>${x.catatan?`<span title="${es(x.catatan)}" style="font-size:11.5px;color:var(--lb2);line-height:1.4;display:block">${es(x.catatan.length>60?x.catatan.slice(0,60)+'…':x.catatan)}</span>`:'<span style="color:var(--lb4)">—</span>'}</td>
  <td>${es(ln(x.lok))}</td>

 </tbody></table></div>
 <p style="font-size:11.5px;color:var(--lb3);margin-top:9px">Menampilkan ${r.length} dari ${DB.aset.length} aset · ${punyaLink()} sudah punya QR · ${sudahCetak()} sudah dicetak.${(F.tglA||F.tglB)?` Perolehan ${F.tglA?dt(pd(F.tglA)):'paling awal'} sampai ${F.tglB?dt(pd(F.tglB)):'terakhir'}.`:''}${F.lok?` Lokasi ${es(ln(F.lok))}.`:''}</p>`;

function addCart(k){
 const x=A(k);
 if(!x){toast('Kode '+k+' tidak ditemukan','r');return false}
 if(CART.includes(k)){toast('Sudah ada di daftar','r');return false}
 if(x.stat==='DIPINJAM'){toast(x.nama+' sedang dipinjam '+loanOf(k).org,'r');return false}
 if(x.stat==='PERBAIKAN'){toast(x.nama+' sedang di vendor','r');return false}
 if(x.stat==='HILANG'){toast(x.nama+' berstatus hilang','r');return false}
 CART.push(k);toast(x.nama+' ditambahkan','g');return true;
}

function runRekon(){
 const F2=[];let i=0;
 const aK=new Set(DB.aset.map(x=>x.kode)),cK=new Set(ACC.map(x=>x.kode));
 ACC.forEach(ac=>{
  if(!aK.has(ac.kode))F2.push({id:'F'+(++i),t:'T1',kode:ac.kode,j:ac.nama,ket:'Aset baru — perolehan '+dt(new Date(ac.thn,ac.bln,10)),va:rp(ac.harga),vb:'tidak ada',aksi:'Daftarkan',done:false,raw:ac});
  else{const x=A(ac.kode);
   if(ac.nama&&ac.nama!==x.nama)F2.push({id:'F'+(++i),t:'T3',kode:ac.kode,j:'Selisih nama aset',ket:'Nama berbeda antara dua sistem',va:ac.nama,vb:x.nama,aksi:'Samakan',done:false,raw:ac});
   else F2.push({id:'F'+(++i),t:'T4',kode:ac.kode,j:x.nama,ket:'Penyusutan bulan berjalan',va:rp(x.nb),vb:rp(x.nb),aksi:'',done:true});}
 });
 DB.aset.forEach(x=>{if(!cK.has(x.kode))F2.push({id:'F'+(++i),t:'T2',kode:x.kode,j:x.nama,ket:'Terdaftar di aplikasi tapi tidak ada di Accurate',va:'tidak ada',vb:rp(x.nb),aksi:'Arsipkan',done:false})});
 DB.rekon={periode:'Juli 2026',w:new Date(),nA:ACC.length,nB:DB.aset.length,f:F2};
 log('IMPOR','REKON','Juli 2026','Rekonsiliasi Juli 2026 dijalankan');
 const s=F2.filter(f=>!f.done).length;
 toast(s?`Selesai — ${s} temuan perlu tindakan`:'Selesai — semua cocok',s?'':'g');
 RS2=F2.some(f=>f.t==='T1'&&!f.done)?'T1':'T4';render();
}
function fixFinding(id){
 const f=DB.rekon.f.find(x=>x.id===id);if(!f||f.done)return;
 if(f.t==='T1'){const c=f.raw;
  DB.aset.push(mk(c.kode,c.nama,c.kat,c.dept,'GDA','','TERSEDIA','BAGUS','—',c.thn,c.bln,c.harga,c.umur,c.residu||0));
  log('BUAT','ASET',c.kode,`${c.nama} didaftarkan dari rekonsiliasi`);toast(c.nama+' didaftarkan','g');
 }else if(f.t==='T3'){const x=A(f.kode),o=x.nama;x.nama=f.raw.nama;
  log('UBAH','ASET',f.kode,`Nama disamakan: "${o}" → "${x.nama}"`);toast('Nama disamakan dengan Accurate','g');
 }else if(f.t==='T2'){const x=A(f.kode);x.stat='HILANG';
  log('UBAH','ASET',f.kode,`${x.nama} diarsipkan — tidak ada di Accurate`);toast(x.nama+' diarsipkan','g');}
 f.done=true;render();
}

function doFin(k){
 const x=A(k),h=+$('#fH').value||0,r=+$('#fR').value||0,u=+$('#fU').value||0,t=pd($('#fT').value),al=$('#fA').value.trim();
 if(h<0)return toast('Harga perolehan tidak boleh negatif','r');
 if(h>0&&r>=h)return toast('Nilai residu harus lebih kecil dari harga perolehan','r');
 if(u<1)return toast('Masa manfaat minimal 1 bulan','r');
 if(isNaN(t.getTime()))return toast('Tanggal perolehan tidak valid','r');
 if(!al)return toast('Alasan perubahan wajib diisi — ini yang dibaca auditor','r');
 const bf=`${rp(x.harga)}/${rp(x.residu||0)}/${x.umur}bln/nb ${rp(x.nb)}`;
 x.harga=h;x.residu=r;x.umur=u;x.tgl=t;x.override=al;x.overrideOleh=USER.nama;x.overrideTgl=new Date();
 hitung(x);
 log('UBAH','ASET',k,`Nilai finansial ${x.nama} diubah manual: ${bf} → ${rp(h)}/${rp(r)}/${u}bln/nb ${rp(x.nb)} · alasan: ${al}`);
 toast('Nilai finansial diperbarui — ditandai diedit manual','g');closeAll();openAsset(k);render();
}
function jadwalSusut(k){
 const x=A(k),rows=[];let ak=0;const dsr=Math.max(0,x.harga-(x.residu||0));
 for(let i=1;i<=Math.min(x.umur,240);i++){
  const d=new Date(x.tgl.getFullYear(),x.tgl.getMonth()+i,1);
  ak=Math.min(dsr,x.perBln*i);
  rows.push({i,d,b:x.perBln,ak,nb:x.harga-ak,lalu:d<=TODAY});
 }
 const lewat=rows.filter(r=>r.lalu).length;
 modal('Jadwal penyusutan',`

/* ═══════ CETAK KE PRINTER P15 (jembatan Bluetooth di GitHub Pages) ═══════
   Aplikasi ini sendiri tidak bisa bicara Bluetooth (Apps Script berjalan di
   iframe tersendiri). Jembatannya adalah halaman terpisah yang menerima
   daftar label lewat #d=<base64url JSON>, lalu mengirimkannya ke P15 lewat
   Web Bluetooth. Ukuran label ikut dikirim supaya kertas 12×40mm (atau
   berapa pun yang sedang dipakai) langsung terisi di sana — tetap bisa
   diubah manual di halaman itu kalau perlu. */
const P15_BRIDGE='https://naufalfiras20.github.io/Printer-P15-App-Script-Custom---Naufal/';
function b64url(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function payloadP15(kodeList){
 const L=DB.cfg.label;
 return{
  label:kodeList.map(k=>{const x=A(k);return{kode:k,nama:x?x.nama:k,link:x?x.link:''}}),
  cfg:{lebarMm:L.w,tinggiMm:L.h,marginMm:L.mg,dpi:L.dpi,kertas:'celah',tpl:T()}
 };
}
function bukaP15(kodeList){
 const ks=kodeList.filter(k=>A(k));
 const tanpa=kodeList.length-ks.length;
 if(!ks.length)return toast('Tidak ada aset valid untuk dicetak','r');
 const url=P15_BRIDGE+'#d='+b64url(JSON.stringify(payloadP15(ks)));
 window.open(url,'_blank');
 log('CETAK','ASET','—',`${ks.length} label dikirim ke pencetak P15${tanpa?` (${tanpa} dilewati, kode tidak ditemukan)`:''}`);
 toast(`Membuka pencetak P15 — ${ks.length} label${tanpa?`, ${tanpa} dilewati`:''}`,'g');
}

/* ═══════ IMPOR CSV ═══════ */
function parseCSV(t){
 const rows=[];let f='',r=[],q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;
  else if(c===','||c===';'||c==='\t'){r.push(f);f=''}
  else if(c==='\n'){r.push(f);f='';if(r.some(v=>v.trim()))rows.push(r);r=[]}
  else if(c!=='\r')f+=c}
 r.push(f);if(r.some(v=>v.trim()))rows.push(r);
 return rows;
}

   $('#doImp').disabled=true;return}
  const out=[];const seen=new Set();const seenLink=new Set();

   if(craw){if(/hibah|donas|gratis|grant|donation/.test(craw))cara='HIBAH';

/* ── 2. Ganti nama kolom yang di Postgres jadi huruf kecil ──
   Identifier tanpa tanda kutip di Postgres selalu dilipat jadi huruf
   kecil (dicetakTgl -> dicetaktgl). Prototipe di atas mengharapkan
   nama field persis camelCase seperti di Apps Script dulu, jadi
   dipetakan balik di sini — satu tempat, dipakai semua jalur baca. */
const PETA_ASET = { overrideoleh:'overrideOleh', overridetgl:'overrideTgl', dibuatoleh:'dibuatOleh',
  diubaholeh:'diubahOleh', dicetaktgl:'dicetakTgl', dicetakoleh:'dicetakOleh' };
const PETA_HAPUS = { alasanhapus:'alasanHapus', dihapusoleh:'dihapusOleh', dihapustgl:'dihapusTgl',
  dicetaktgl:'dicetakTgl', dicetakoleh:'dicetakOleh' };
const PETA_PINJAM = { catbalik:'catBalik', kondbalik:'kondBalik', asallok:'asalLok' };
const PETA_OPNAME_DETAIL = { lokharusnya:'lokHarusnya' };
const PETA_REKON = { nilaiaccurate:'nilaiAccurate', nilaiapp:'nilaiApp' };
const PETA_LOG = { identitas:'idEntitas' };
const PETA_LEPAS = { nbsaat:'nbSaat' };

function petakan(obj, peta) {
  if (!obj) return obj;
  if (Array.isArray(obj)) return obj.map(o => petakan(o, peta));
  const out = {};
  for (const k in obj) out[peta[k] || k] = obj[k];
  return out;
}

/* ── 3. Bantu lempar error kalau Supabase mengembalikan error ── */
function cekGalat(r) {
  if (r.error) throw new Error(r.error.message || 'Terjadi kesalahan di server');
  return r.data;
}

/* ── 4. apiMuat pengganti — susun ulang seluruh state awal ──── */
async function supaMuat() {
  const { data: { user } } = await supa.auth.getUser();
  if (!user) throw new Error('Belum login.');

  const [pRow, master, aset, mutasi, pinjam, rawat, hapus, lepas, rekon, audit, konfig,
         opnameSesi, opnameDetail, izinRow] = await Promise.all([
    supa.from('pengguna').select('*').eq('id', user.id).single().then(r => r.data),
    supa.from('master').select('*').eq('aktif', true).order('urut'),
    supa.from('aset').select('*'),
    supa.from('mutasi').select('*'),
    supa.from('pinjam').select('*'),
    supa.from('rawat').select('*'),
    supa.from('hapus').select('*'), supa.from('lepas').select('*'),
    supa.from('rekon').select('*'),
    supa.from('log_audit').select('*').order('waktu', { ascending: false }).limit(300),
    supa.from('konfig').select('*'),
    supa.from('opname_sesi').select('*'),
    supa.from('opname_detail').select('*'),
    supa.from('pengguna').select('id').eq('id', user.id).single().then(() => null), // placeholder, izin diambil di bawah
  ]);

  if (!pRow) throw new Error('Akun ini belum terdaftar. Minta admin menambahkan lewat menu Pengguna.');
  if (!pRow.aktif) throw new Error('Akun ' + pRow.email + ' dinonaktifkan atau belum diaktifkan admin.');

  const izinRes = await supa.from('peran_izin').select('izin').eq('peran', pRow.peran);
  const izin = cekGalat(izinRes).map(x => x.izin);

  const masterRows = cekGalat(master); const lepasMap = {}; cekGalat(lepas).forEach(l => { lepasMap[l.kode] = petakan(l, PETA_LEPAS); });
  const grup = (s) => masterRows.filter(m => m.set_ === s).map(m => ({ k: m.kode, n: m.nama }));

  const konfigObj = {};
  cekGalat(konfig).forEach(k => { konfigObj[k.kunci] = k.nilai; });

  const sesiRows = cekGalat(opnameSesi);
  const detailRows = cekGalat(opnameDetail).map(d => petakan(d, PETA_OPNAME_DETAIL));
  const berjalan = sesiRows.find(s => s.status === 'BERJALAN') || null;
  const arsip = sesiRows.filter(s => s.status === 'SELESAI').map(s =>
    Object.assign({}, s, { detail: detailRows.filter(d => d.sesi === s.id) }));
  if (berjalan) berjalan.detail = detailRows.filter(d => d.sesi === berjalan.id);

  return {
    pengguna: { nama: pRow.nama, inisial: (pRow.nama || pRow.email).charAt(0).toUpperCase(),
      peran: pRow.peran, email: pRow.email },
    izin,
    aset: petakan(cekGalat(aset), PETA_ASET).map(x => Object.assign(x, { lepas: lepasMap[x.kode] || null })),
    dept: grup('dept'), kat: grup('kat'), lok: grup('lok'), org: grup('org'), proy: grup('proy'),
    mutasi: cekGalat(mutasi),
    pinjam: petakan(cekGalat(pinjam), PETA_PINJAM),
    rawat: cekGalat(rawat),
    opname: berjalan, opnameArsip: arsip,
    hapus: petakan(cekGalat(hapus), PETA_HAPUS),
    rekon: petakan(cekGalat(rekon), PETA_REKON),
    audit: petakan(cekGalat(audit), PETA_LOG),
    konfig: konfigObj,
    app: { nama: 'Aset UHP', versi: '2.0', org: 'Upscale House Project', oleh: 'Naufal Firas Sutia' }
  };
}

/* ── 5. srv() pengganti — dipanggil persis seperti sebelumnya ─
   srv(nama, ...args): nama = 'apiTambahAset' dkk, args = argumen
   posisional yang sama persis dengan yang dulu dikirim ke Apps Script. */
function srv(nama, ...args) {
  return (async () => {
    switch (nama) {

      case 'apiMuat':
        return await supaMuat();

      case 'apiTambahAset':
        return petakan(cekGalat(await supa.rpc('rpc_tambah_aset', { f: args[0] })), PETA_ASET);

      case 'apiUbahOperasional':
        return petakan(cekGalat(await supa.rpc('rpc_ubah_operasional', { p_kode: args[0], f: args[1] })), PETA_ASET);

      case 'apiUbahFinansial':
        return petakan(cekGalat(await supa.rpc('rpc_ubah_finansial', { p_kode: args[0], f: args[1] })), PETA_ASET);

      case 'apiSetLink':
        return petakan(cekGalat(await supa.rpc('rpc_set_link', { p_kode: args[0], p_link: args[1] })), PETA_ASET);

      case 'apiTandaiCetak':
        return petakan(cekGalat(await supa.rpc('rpc_tandai_cetak', { p_kode: args[0], p_dicetak: args[1] })), PETA_ASET);

      case 'apiTandaiCetakMassal':
        return cekGalat(await supa.rpc('rpc_tandai_cetak_massal', { p_kode_list: args[0], p_dicetak: args[1] }));

      case 'apiTerapkanPola':
        return cekGalat(await supa.rpc('rpc_terapkan_pola', { p_pola: args[0], p_timpa: args[1] }));

      case 'apiTerapkanPolaPilihan': // dipakai adaptor untuk massalPola, bukan nama asli Apps Script
        return cekGalat(await supa.rpc('rpc_terapkan_pola_pilihan', { p_kode_list: args[0], p_pola: args[1] }));

      case 'apiPindahMassal':
        return cekGalat(await supa.rpc('rpc_pindah_massal', { p_kode_list: args[0], p_lok: args[1] }));

      case 'apiHapusAset':
        cekGalat(await supa.rpc('rpc_hapus_aset', { p_kode: args[0], p_alasan: args[1], p_konfirmasi: args[2] }));
        return null;

      case 'apiPinjam':
        return cekGalat(await supa.rpc('rpc_pinjam', { f: args[0] }));

      case 'apiTerima': {
        const r = cekGalat(await supa.rpc('rpc_terima', { p_id_pinjam: args[0], f: args[1] }));
        return { aset: petakan(r.aset, PETA_ASET), pinjam: petakan(r.pinjam, PETA_PINJAM) };
      }

      case 'apiLepas':
        return petakan(cekGalat(await supa.rpc('rpc_lepas', { p_kode: args[0], f: args[1] })), PETA_LEPAS);

      case 'apiBatalLepas':
        return petakan(cekGalat(await supa.rpc('rpc_batal_lepas', { p_kode: args[0] })), PETA_ASET);

      case 'apiBukaOpname':
        return cekGalat(await supa.rpc('rpc_buka_opname', { f: args[0] }));

      case 'apiPindaiOpname':
        return petakan(cekGalat(await supa.rpc('rpc_pindai_opname', { p_kode: args[0] })), PETA_OPNAME_DETAIL);

      case 'apiKondisiOpname':
        return petakan(cekGalat(await supa.rpc('rpc_kondisi_opname', { p_kode: args[0], p_kond: args[1] })), PETA_ASET);

      case 'apiTutupOpname':
        return cekGalat(await supa.rpc('rpc_tutup_opname', { p_ada: args[0]||[] }));

      case 'apiTambahMaster':
        return cekGalat(await supa.rpc('rpc_tambah_master', { p_set: args[0], p_kode: args[1], p_nama: args[2] }));

      case 'apiUbahMaster':
        return cekGalat(await supa.rpc('rpc_ubah_master', { p_set: args[0], p_kode: args[1], p_nama_baru: args[2] }));

      case 'apiHapusMaster':
        cekGalat(await supa.rpc('rpc_hapus_master', { p_set: args[0], p_kode: args[1] }));
        return null;

      case 'apiSimpanKonfig':
        return cekGalat(await supa.rpc('rpc_simpan_konfig', { obj: args[0] }));

      case 'apiImporAset':
        return cekGalat(await supa.rpc('rpc_impor_aset', { rows: args[0] }));

      case 'apiUbahTambahan':
        return petakan(cekGalat(await supa.rpc('rpc_ubah_tambahan', { p_kode: args[0], f: args[1] })), PETA_ASET);

      case 'apiJalankanRekon':
        return cekGalat(await supa.rpc('rpc_jalankan_rekon', { p_periode: args[0], p_baris_accurate: args[1] }));

      case 'apiSelesaikanTemuan':
        return petakan(cekGalat(await supa.rpc('rpc_selesaikan_temuan', { p_id: args[0], p_tindakan: args[1] })), PETA_REKON);

      case 'apiDaftarPengguna':
        return cekGalat(await supa.rpc('rpc_daftar_pengguna'));

      case 'apiSimpanPengguna':
        return cekGalat(await supa.rpc('rpc_ubah_peran_pengguna',
          { p_email: args[0], p_nama: args[1], p_peran: args[2], p_aktif: args[3] }));

      default:
        throw new Error('Aksi "' + nama + '" belum dipetakan ke Supabase.');
    }
  })().then(hasil => ({ ok: true, data: hasil === undefined ? null : hasil, pesan: '' }))
    .catch(e => ({ ok: false, data: null, pesan: e.message || String(e) }))
    .then(r => { if (r.ok === false) throw new Error(r.pesan); return r.data; });
}

/* ── 6. Sisanya identik dengan ADAPTOR SERVER lama ──────────
   Fungsi-fungsi ini tidak peduli dari mana datanya berasal — mereka
   cuma memanggil srv()/aksi()/aksiAset() dan membaca data yang sudah
   berbentuk camelCase, jadi disalin apa adanya. */

const TGL_FIELD=['tgl','garansi','overrideTgl','dibuat','diubah','keluar','jt','balik',
 'jadwal','pelaksanaan','dicatat','waktu','mulai','selesai','dipindai','dijalankan','w','dihapusTgl','dicetakTgl'];
function hidupkanTanggal(o){
  if(o===null||o===undefined)return o;
  if(Array.isArray(o))return o.map(hidupkanTanggal);
  if(typeof o==='object'){
    const out={};
    for(const k in o){
      const v=o[k];
      if(typeof v==='string'&&TGL_FIELD.includes(k)&&/^\d{4}-\d{2}-\d{2}/.test(v)) out[k]=new Date(v);
      else out[k]=hidupkanTanggal(v);
    }
    return out;
  }
  return o;
}

function galat(e){
  console.error(e);
  toast(e.message||'Terjadi kesalahan','r');
}

async function aksi(nama,...args){
  try{
    const hasil=await srv(nama,...args);
    await muatUlang();
    return hasil;
  }catch(e){ galat(e); throw e; }
}

function tempelAset(a){
  if(!a||!a.kode)return false;
  a=hidupkanTanggal(a);
  a.dok=typeof a.dok==='string'?(()=>{try{return JSON.parse(a.dok)}catch(e){return []}})():(a.dok||[]);
  if(!a.dibuat)a.dibuat=a.tgl;
  const i=DB.aset.findIndex(x=>x.kode===a.kode);
  if(i>=0&&DB.aset[i].lepas&&!a.lepas)a.lepas=DB.aset[i].lepas;
  hitung(a);
  if(i>=0)DB.aset[i]=a; else DB.aset.push(a);
  return true;
}

function catatLokal(aksiNama,kode,ket){
  DB.audit.unshift({w:new Date(),u:USER.nama,a:aksiNama,e:'ASET',i:kode,k:ket});
}

async function aksiAset(nama,...args){
  try{
    const hasil=await srv(nama,...args);
    if(tempelAset(hasil)) render(); else await muatUlang();
    return hasil;
  }catch(e){ galat(e); throw e; }
}

async function muatUlang(){
  const d=hidupkanTanggal(await srv('apiMuat'));
  pasangData(d);
  render();
}

function pasangData(d){
  USER={nama:d.pengguna.nama,inisial:d.pengguna.inisial,peran:d.pengguna.peran,email:d.pengguna.email};
  IZIN_SERVER=d.izin||[];

  DB.aset=d.aset.map(a=>{
    a.dok=typeof a.dok==='string'?(()=>{try{return JSON.parse(a.dok)}catch(e){return []}})():(a.dok||[]);
    a.dibuat=a.tgl;
    hitung(a);
    return a;
  });
  DB.dept=d.dept; DB.kat=d.kat; DB.lok=d.lok;
  DB.org=d.org.length?d.org:DB.org;
  DB.proy=d.proy.length?d.proy:DB.proy;
  DB.hapus=(d.hapus||[]).map(a=>{a.dibuat=a.tgl;return a});
  DB.mutasi=d.mutasi;
  DB.pinjam=d.pinjam;
  DB.rawat=d.rawat;
  DB.audit=(d.audit||[]).map(l=>({w:l.waktu,u:l.pengguna,a:l.aksi,e:l.entitas,i:l.idEntitas,k:l.keterangan}));
  DB.opname=d.opname?{nama:d.opname.nama,lok:d.opname.lok,mulai:d.opname.mulai,pj:d.opname.pj,
    detail:(d.opname.detail||[]).map(z=>({kode:z.kode,exp:z.lokHarusnya,st:z.st,kond:z.kond,w:z.dipindai}))}:null;
  DB.opnameArsip=(d.opnameArsip||[]).map(o=>({nama:o.nama,lok:o.lok,mulai:o.mulai,selesai:o.selesai,pj:o.pj,
    detail:(o.detail||[]).map(z=>({kode:z.kode,st:z.st,kond:z.kond}))}));

  const K=d.konfig||{};

/* importCSV disalin utuh dari prototipe — satu-satunya baris yang beda
   adalah $('#doImp').onclick di paling akhir, yang sekarang mengirim ke
   server (apiImporAset) alih-alih hanya push ke DB.aset di memori. */
function importCSV(){
 if(!can('impor'))return toast('Peran '+PERAN[USER.peran].n+' tidak boleh mengimpor','r');
 modal('Impor aset dari CSV',`
  <p style="font-size:12px;color:var(--lb3);margin-bottom:11px;line-height:1.55">Tempel isi CSV di bawah, atau pilih berkas. Baris pertama harus berisi nama kolom. Pemisah koma, titik koma, atau tab — dideteksi otomatis.</p>
  <div style="display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap">
   <button class="b s" id="cvFile">${ic('up')}Pilih berkas CSV</button>
   <button class="b s" id="cvContoh">Isi contoh</button>
  </div>
  <textarea class="in" id="cvT" style="min-height:110px;font-family:ui-monospace,monospace;font-size:11px" placeholder="kode,nama,kategori,departemen,harga,masa manfaat"></textarea>
  <div id="cvPrev" style="margin-top:12px"></div>`,
  `<button class="b" onclick="closeAll()">Batal</button><button class="b n" id="doImp" disabled>Impor</button>`,600);
 $('#cvContoh').onclick=()=>{$('#cvT').value=
`kode,nama,kategori,departemen,lokasi,kondisi,harga,residu,masa manfaat,tanggal,sn,garansi
PRD-CAM-050,Canon EOS R5 C,CAM,PRD,GDA,Sangat bagus,68500000,7000000,60,2026-01-15,R5C-9921,2028-01-15
PRD-LNS-030,Canon RF 24-70,LNS,PRD,GDA,Bagus,32900000,0,72,2026-02-10,RF2470-118,
LIV-LGT-055,Amaran 300c,LGT,LIV,STA,Cukup bagus,14200000,0,48,2026-03-05,AM300-77,
PRD-CAM-014,Duplikat sengaja,CAM,PRD,GDA,Bagus,1000000,0,48,2026-01-01,DUP,
BAD-XXX-001,Kategori tidak dikenal,ZZZ,PRD,GDA,Bagus,5000000,0,48,2026-01-01,X,
PRD-AUD-090,Harga kosong,AUD,PRD,GDA,Bagus,,0,48,2026-01-01,Y,
PRD-LGT-091,Kondisi ngawur,LGT,PRD,GDA,Butut banget,3000000,0,48,2026-01-01,Z,`;
  cek()};
 $('#cvFile').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.csv,text/csv,text/plain';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
   rd.onload=()=>{$('#cvT').value=rd.result;cek()};rd.readAsText(f)};i.click()};
 let VALID=[];
 const cek=()=>{
  const rows=parseCSV($('#cvT').value.trim());
  if(rows.length<2){$('#cvPrev').innerHTML='';$('#doImp').disabled=true;return}
  const hd=rows[0].map(x=>x.trim().toLowerCase());
  const idx={};Object.entries(HMAP).forEach(([f,alias])=>{const i=hd.findIndex(h=>alias.includes(h));if(i>=0)idx[f]=i});
  const miss=['kode','nama','harga'].filter(f=>idx[f]===undefined);
  if(miss.length){$('#cvPrev').innerHTML=`<div style="background:var(--rdB);border-radius:9px;padding:10px 12px;font-size:11.5px;color:var(--rd);line-height:1.55">Kolom wajib tidak ditemukan: <b>${miss.join(', ')}</b>. Kolom terdeteksi: ${Object.keys(idx).join(', ')||'tidak ada'}.</div>`;
   $('#doImp').disabled=true;return}
  const out=[];const seen=new Set();const seenLink=new Set();
  rows.slice(1).forEach((r,i)=>{
   const g=f=>idx[f]!==undefined?(r[idx[f]]||'').trim():'';
   const kode=g('kode').toUpperCase(),nama=g('nama'),harga=+g('harga').replace(/[^\d.-]/g,'');
   const err=[];
   if(!kode)err.push('kode kosong');
   else if(kode.length>16)err.push('kode >16 karakter');
   else if(A(kode))err.push('kode sudah ada');
   else if(seen.has(kode))err.push('kode dobel di file');
   if(!nama)err.push('nama kosong');
   if(!harga)err.push('harga kosong/tidak valid');
   const kat=g('kat').toUpperCase()||'CAM',dept=g('dept').toUpperCase()||'OPS',lok=g('lok').toUpperCase()||'GDA';
   if(g('kat')&&!DB.kat.some(c=>c.k===kat))err.push('kategori '+kat+' tidak dikenal');
   if(g('dept')&&!DB.dept.some(c=>c.k===dept))err.push('departemen '+dept+' tidak dikenal');
   if(g('lok')&&!DB.lok.some(c=>c.k===lok))err.push('lokasi '+lok+' tidak dikenal');
   const residu=+g('residu').replace(/[^\d.-]/g,'')||0,umur=+g('umur').replace(/[^\d.-]/g,'')||48;
   if(residu>=harga&&harga)err.push('residu ≥ harga');
   let tgl=pd(g('tgl'));if(isNaN(tgl.getTime()))tgl=new Date(TODAY);
   let kond='BAGUS';const kraw=g('kond').toLowerCase();
   if(kraw){if(KONDALIAS[kraw])kond=KONDALIAS[kraw];else if(KD[kraw.toUpperCase()])kond=kraw.toUpperCase();else err.push('kondisi "'+g('kond')+'" tidak dikenal')}
   let gar=null;if(g('garansi')){const gd=pd(g('garansi'));if(!isNaN(gd.getTime()))gar=gd;else err.push('tanggal garansi tidak valid')}
   const lk=g('link');
   if(lk){
    const pakai=pemakaiLink(lk,null);
    if(pakai)err.push('link sudah dipakai '+pakai.kode);
    else if(seenLink.has(lk.toLowerCase()))err.push('link kembar di dalam berkas');
    else seenLink.add(lk.toLowerCase());
   }
   let cara='BELI';const craw=g('cara').toLowerCase();
   if(craw){if(/hibah|donas|gratis|grant|donation/.test(craw))cara='HIBAH';
    else if(/beli|pembelian|purchase|buy/.test(craw))cara='BELI';
    else err.push('cara perolehan "'+g('cara')+'" tidak dikenal')}
   if(!err.length)seen.add(kode);
   out.push({n:i+2,kode,nama,kat,dept,lok,harga,residu,umur,tgl,sn:g('sn')||'—',link:g('link'),kond,gar,cara,catatan:g('catatan'),err});
  });
  VALID=out.filter(o=>!o.err.length);
  const gagal=out.filter(o=>o.err.length);
  $('#cvPrev').innerHTML=`
   <div style="display:flex;gap:16px;margin-bottom:9px">
    <div><div style="font-size:11px;color:var(--lb3)">Terbaca</div><div style="font-size:16px;font-weight:600">${out.length}</div></div>
    <div><div style="font-size:11px;color:var(--lb3)">Siap impor</div><div style="font-size:16px;font-weight:600;color:var(--gr)">${VALID.length}</div></div>
    <div><div style="font-size:11px;color:var(--lb3)">Ditolak</div><div style="font-size:16px;font-weight:600;color:${gagal.length?'var(--rd)':'var(--lb3)'}">${gagal.length}</div></div>
   </div>
   <div style="max-height:30vh;overflow-y:auto;margin:0 -16px;border-top:.5px solid var(--sep)"><table>
    <thead><tr><th style="width:34px">Br</th><th style="width:104px">Kode</th><th>Nama</th><th style="width:88px">Kondisi</th><th style="width:150px">Status</th></tr></thead>
    <tbody>${out.map(o=>`<tr><td class="mn" style="color:var(--lb3)">${o.n}</td><td class="mn">${es(o.kode)||'—'}</td>
    <td>${es(o.nama)||'—'}</td><td>${o.err.length?'':kox(o.kond)}</td><td>${o.err.length?`<span style="color:var(--rd);font-size:11px">${es(o.err.join(', '))}</span>`:pl('g','siap')}</td></tr>`).join('')}</tbody></table></div>`;
  $('#doImp').disabled=!VALID.length;
 };
 $('#cvT').oninput=cek;
 $('#doImp').onclick=async ()=>{
  $('#doImp').disabled=true; $('#doImp').textContent='Mengimpor…';
  const rows=VALID.map(o=>({kode:o.kode,nama:o.nama,kat:o.kat,dept:o.dept,lok:o.lok,harga:o.harga,
    residu:o.residu,umur:o.umur,tgl:o.tgl.toISOString().slice(0,10),sn:o.sn,link:o.link,kond:o.kond,
    garansi:o.gar?o.gar.toISOString().slice(0,10):null,cara:o.cara,catatan:o.catatan}));
  try{
   const r=await aksi('apiImporAset',rows);
   toast((r&&r.masuk!==undefined?r.masuk:VALID.length)+' aset diimpor'+
     (r&&r.tolak&&r.tolak.length?`, ${r.tolak.length} ditolak server`:''),'g');
   closeAll();
  }catch(e){ $('#doImp').disabled=false; $('#doImp').textContent='Impor'; }
 };
}

      <tbody>${daftar.map(baris).join('')}</tbody>
    </table></div>`,
    `<button class="b" onclick="closeAll()">Tutup</button>`, 620);
  document.querySelectorAll('.pgSim').forEach(btn=>{
    btn.onclick = async ()=>{
      const tr = btn.closest('tr');

      const nama = tr.querySelector('.pgN').value.trim();
      const peran = tr.querySelector('.pgP').value;
      const aktif = tr.querySelector('.pgA').checked;
      btn.disabled = true; btn.textContent='...';
      try{
        await srv('apiSimpanPengguna', email, nama, peran, aktif);
        toast(nama+' disimpan','g');
        btn.textContent='Simpan'; btn.disabled=false;
      }catch(e){ toast(e.message,'r'); btn.textContent='Simpan'; btn.disabled=false; }
    };
  });
}

    document.getElementById('bootT').textContent='Gagal memuat';
    document.getElementById('bootE').textContent=e.message||String(e);
    if(/belum login|belum terdaftar|dinonaktifkan/i.test(e.message||'')){
      document.getElementById('boot').style.display='none';
      tampilkanLogin(e.message);
    }
  }
}

(async function mulai(){
  const { data:{ session } } = await supa.auth.getSession();
  if(!session){ document.getElementById('boot').style.display='none'; tampilkanLogin(); return; }
  await mulaiSetelahLogin();
})();

supa.auth.onAuthStateChange((event) => {
  if(event === 'SIGNED_OUT'){ location.reload(); }
});

</script>
